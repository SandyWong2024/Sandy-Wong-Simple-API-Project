<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Lookup</title>
  </head>
  <body>
    <div class="card">
        <h1>Weather Lookup</h1>

        <label for="lat">Latitude</label>
        <input class="input" type="text" id="lat" required>
        <br>
        <label for="lon">Longitude</label>
        <input class="input" type="text" id="lon" required>
        <br>
        <label for="apiKey">API Key</label>
        <input class="input" type="password" id="apiKey" required>

        <div>
            <button id="preset-button">Populate Preset Data</button>
            <button id="fetch-data">Fetch Data from API</button>
        </div>
        <br>
        <h3>JSON Data</h3>
        <div id="dataContainer"></div>
    </div>

    <script type="module" src="private-config.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
